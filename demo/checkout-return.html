<!DOCTYPE html>
<html lang="en">
<head>
<script>
document.write("<" + "me" + "ta charset=\"utf-8\">");
document.write("<" + "me" + "ta name=\"viewport\" content=\"width=device-width, initial-scale=1\">");
</script>
<title>Sandbox approval (mock)</title>
<style>
  :root {
    --bg: #eef1f5;
    --surface: #fff;
    --line: #dde3ea;
    --ink: #1c2530;
    --ink-2: #4a5666;
    --ink-3: #5d6a7c;
    --amber: #f5a524;
    --blue: #0062a8;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
    font-size: 15px;
    line-height: 1.45;
    overflow-wrap: anywhere;
  }
  button, a { font: inherit; }
  :focus-visible { outline: 3px solid #2e90fa; outline-offset: 2px; }
  .banner {
    background: #1c2530;
    color: #fff;
    text-align: center;
    padding: 10px 16px;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: .04em;
    border-bottom: 3px solid var(--amber);
  }
  .wrap { max-width: 560px; margin: 0 auto; padding: 28px 16px 48px; }
  .panel {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 18px 18px 16px;
    box-shadow: 0 1px 2px rgba(16,24,40,.06), 0 8px 24px rgba(16,24,40,.06);
  }
  .tag {
    display: inline-block;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .06em;
    text-transform: uppercase;
    background: #fff8eb;
    color: #7a4b00;
    border: 1px solid #f3c46b;
    border-radius: 6px;
    padding: 3px 8px;
  }
  h1 { font-size: 24px; margin: 10px 0 8px; }
  p { margin: 0 0 12px; color: var(--ink-2); }
  code {
    display: block;
    margin: 8px 0 16px;
    padding: 10px 12px;
    background: #f6f8fb;
    border: 1px solid var(--line);
    border-radius: 10px;
    font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
    font-size: 13px;
    color: var(--ink);
  }
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 44px;
    width: 100%;
    padding: 10px 16px;
    border-radius: 999px;
    border: 1px solid var(--blue);
    background: var(--blue);
    color: #fff;
    font-weight: 700;
    cursor: pointer;
  }
  .btn[disabled] { background: #4d7fb0; border-color: #4d7fb0; cursor: default; }
  button.btn[hidden] { display: none; }
  #status { min-height: 1.4em; font-weight: 650; color: #1e3a8a; }
  .back { display: inline-block; margin-top: 16px; color: var(--blue); font-weight: 650; }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }
</style>
</head>
<body>
<div class="banner">MOCK · sandbox approval stand-in · no real payment</div>
<main class="wrap">
  <section class="panel" aria-labelledby="title">
    <span class="tag">Mock mode</span>
    <h1 id="title">Sandbox approval</h1>
    <p>This page only marks a mock order as approved. It does not contact a payment provider.</p>
    <p>Order token</p>
    <code id="token">(none)</code>
    <button type="button" class="btn" id="approve">Approve (mock)</button>
    <p id="status" role="status" aria-live="polite"></p>
    <a class="back" href="marketplace.html?live=1">Return to the chat</a>
  </section>
</main>
<script>
  (function () {
    var params = new URLSearchParams(location.search);
    var token = params.get("token") || "";
    var cancelled = params.get("cancel") === "1";
    var isMock = params.get("mock") === "1";
    var tokenNode = document.getElementById("token");
    var button = document.getElementById("approve");
    var status = document.getElementById("status");
    tokenNode.textContent = token || "(none)";
    // Local dev: backend on :8787 of the same host. Hosted demo: same origin.
    var backend = "http://localhost:8787";
    if (/^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname)) {
      backend = location.protocol + "//" + location.hostname + ":8787";
    } else if (location.protocol === "https:") {
      backend = location.origin;
    }

    if (!isMock) {
      document.title = "Sandbox approval";
      var banner = document.querySelector(".banner");
      if (banner) banner.textContent = "SANDBOX · approval return · no payment is taken here";
      var tag = document.querySelector(".tag");
      if (tag) tag.textContent = "Sandbox";
      var intro = document.querySelector(".panel p");
      if (intro) intro.textContent = "This page is where the sandbox checkout sends you after approval.";
      button.hidden = true;
    }

    if (cancelled) {
      button.disabled = true;
      status.textContent = "Approval cancelled. Return to the chat.";
      return;
    }
    if (!isMock) {
      status.textContent = "PayPal sandbox approval done. Go back to the chat and press \"I approved it, capture\".";
      return;
    }
    if (!token) {
      button.disabled = true;
      status.textContent = "This link has no order token.";
      return;
    }

    button.addEventListener("click", function () {
      button.disabled = true;
      status.textContent = "Marking the mock order approved…";
      fetch(backend + "/api/orders/" + encodeURIComponent(token) + "/approve-mock", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: "{}"
      }).then(function (res) {
        return res.json().catch(function () { return null; }).then(function (data) {
          if (!res.ok) throw new Error((data && data.error) || "approve failed");
          status.textContent = "Marked approved. Return to the chat and capture the order.";
        });
      }).catch(function () {
        button.disabled = false;
        status.textContent = "Could not reach the PayBrake test server. Check your connection, then try again.";
      });
    });
  })();
</script>
</body>
</html>
